<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 400" width="1500" height="400" role="img" aria-label="Ira Siegel — Senior Software Engineer">
  <defs>
    <!-- Background gradient: deep slate to indigo -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="55%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0c4a6e"/>
    </linearGradient>

    <!-- Accent gradient for the name -->
    <linearGradient id="nameGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#a5f3fc"/>
    </linearGradient>

    <!-- Cyan accent for the tagline underline -->
    <linearGradient id="lineGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="30%" stop-color="#22d3ee" stop-opacity="1"/>
      <stop offset="70%" stop-color="#818cf8" stop-opacity="1"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0"/>
    </linearGradient>

    <!-- Subtle grid pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-width="0.5" opacity="0.04"/>
    </pattern>

    <!-- Soft glow for orbiting dots -->
    <radialGradient id="dot" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1500" height="400" fill="url(#bg)"/>
  <rect width="1500" height="400" fill="url(#grid)"/>

  <!-- Decorative glow blobs -->
  <circle cx="1280" cy="120" r="180" fill="#22d3ee" opacity="0.10"/>
  <circle cx="1380" cy="320" r="140" fill="#818cf8" opacity="0.12"/>
  <circle cx="180" cy="340" r="120" fill="#38bdf8" opacity="0.08"/>

  <!-- Floating code-bracket motifs -->
  <g opacity="0.18" fill="none" stroke="#a5f3fc" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 1140 80 l -30 30 l 30 30"/>
    <path d="M 1200 80 l 30 30 l -30 30"/>
    <path d="M 1160 145 l 20 -60"/>
  </g>
  <g opacity="0.14" fill="none" stroke="#818cf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 90 90 l -20 20 l 20 20"/>
    <path d="M 130 90 l 20 20 l -20 20"/>
  </g>

  <!-- Orbiting dots (React-ish vibe, but subtle) -->
  <g transform="translate(1280 240)" opacity="0.55">
    <ellipse cx="0" cy="0" rx="110" ry="38" fill="none" stroke="#22d3ee" stroke-width="1.2" opacity="0.5"/>
    <ellipse cx="0" cy="0" rx="110" ry="38" fill="none" stroke="#818cf8" stroke-width="1.2" opacity="0.5" transform="rotate(60)"/>
    <ellipse cx="0" cy="0" rx="110" ry="38" fill="none" stroke="#38bdf8" stroke-width="1.2" opacity="0.5" transform="rotate(-60)"/>
    <circle cx="0" cy="0" r="6" fill="#a5f3fc"/>
    <circle cx="110" cy="0" r="4" fill="url(#dot)"/>
    <circle cx="-55" cy="-32" r="3" fill="url(#dot)" transform="rotate(60)"/>
  </g>

  <!-- Greeting / kicker -->
  <text x="90" y="135" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="20" fill="#22d3ee" font-weight="600" letter-spacing="2">
    &lt;hello world /&gt;
  </text>

  <!-- Name -->
  <text x="88" y="225" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="84" font-weight="800" fill="url(#nameGrad)" letter-spacing="-2">
    Ira Siegel
  </text>

  <!-- Underline accent -->
  <rect x="90" y="245" width="420" height="3" rx="2" fill="url(#lineGrad)"/>

  <!-- Tagline -->
  <text x="90" y="290" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="26" font-weight="500" fill="#e2e8f0">
    Senior Software Engineer
  </text>
  <text x="90" y="324" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#94a3b8">
    Frontend-leaning Full Stack &#8226; React &#8226; TypeScript &#8226; Performance
  </text>

  <!-- Tech keyword chips -->
  <g font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="13" font-weight="600">
    <g>
      <rect x="88" y="346" width="78" height="26" rx="13" fill="#0e7490" opacity="0.55"/>
      <text x="127" y="364" fill="#cffafe" text-anchor="middle">React</text>
    </g>
    <g>
      <rect x="174" y="346" width="100" height="26" rx="13" fill="#3730a3" opacity="0.55"/>
      <text x="224" y="364" fill="#e0e7ff" text-anchor="middle">TypeScript</text>
    </g>
    <g>
      <rect x="282" y="346" width="80" height="26" rx="13" fill="#075985" opacity="0.55"/>
      <text x="322" y="364" fill="#e0f2fe" text-anchor="middle">Next.js</text>
    </g>
    <g>
      <rect x="370" y="346" width="66" height="26" rx="13" fill="#155e75" opacity="0.55"/>
      <text x="403" y="364" fill="#cffafe" text-anchor="middle">Node</text>
    </g>
    <g>
      <rect x="444" y="346" width="82" height="26" rx="13" fill="#4338ca" opacity="0.55"/>
      <text x="485" y="364" fill="#e0e7ff" text-anchor="middle">Testing</text>
    </g>
  </g>
</svg>
